<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin — Chá do Matteo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="admin-bg" style="min-height:100vh;">

  <div id="lockScreen" class="page center-page">
    <div class="card lock-card">
      <div style="font-size:34px;">🔒</div>
      <h2 class="display" style="color:var(--sage-dark);margin:8px 0 4px;">Painel Admin</h2>
      <p>Digite o código de acesso.</p>
      <input type="password" id="adminCode" placeholder="código">
      <div class="error-msg" id="errCode">Código incorreto.</div>
      <button class="btn" id="unlockBtn">Entrar</button>
    </div>
  </div>

  <div id="dashboard" class="page hidden">
    <div class="glass" style="padding:20px 18px;">
      <div class="admin-header">
        <h1>Painel — Chá do <span id="nomeBebeLabelAdmin">Matteo</span></h1>
        <span class="live-dot">ao vivo</span>
      </div>

      <div class="stats-row" id="statsRow"></div>

      <div id="listArea">
        <div class="empty-state">Carregando respostas...</div>
      </div>

      <div class="top-actions">
        <button class="btn secondary" id="exportBtn" style="flex:1;">Exportar CSV</button>
        <a href="index.html" class="btn secondary" style="flex:1;text-decoration:none;text-align:center;">Sair</a>
      </div>
    </div>
  </div>

</div>

<script type="module" src="script.js"></script>
</body>
</html>

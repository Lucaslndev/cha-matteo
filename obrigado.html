<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obrigado! — Chá do Matteo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="thanks-page">

<div class="floaters" id="floaters"></div>

<div class="page center-page">
  <div style="width:100%;">
    <div class="envelope">✉️</div>
    <div class="card thanks-card">
      <h2 class="display">Obrigado pela confirmação!</h2>
      <p id="thanksMsg">Sua resposta foi registrada com muito carinho.</p>
    </div>

    <div class="card map-card" id="mapCard">
      <div class="map-visual">📍</div>
      <div class="map-info">
        <strong>Local do evento</strong>
        <span id="enderecoTxt"></span>
      </div>
    </div>

    <a href="index.html" class="btn secondary" style="text-decoration:none;">Voltar ao início</a>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
